<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Superstore Fun Facts</title>
    <link rel="stylesheet" href="src/styles.css" />
    <link rel="stylesheet" href="src/landscape.css" />
    <style>
      /* Built for a 1600 x 1000 Tableau web page object. In any other window the canvas shrinks to fit. */
      html, body { margin: 0; background: #0b1118; }
      #app { width: 1600px; height: 1000px; min-height: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        function fit() { var s = Math.min(1, window.innerWidth / 1600, window.innerHeight / 1000); document.body.style.zoom = s; }
        window.addEventListener('resize', fit); fit();
      })();
    </script>
    <!-- Static version for Tableau Public: data.js holds a snapshot of Sample - Superstore,
         and static-data.js answers the app's queries from it in place of the Tableau Extensions API.
         The portrait version (1200 x 2000) lives in portrait/. -->
    <script src="src/data.js"></script>
    <script src="src/static-data.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
